# Add this job (or these steps) to each indexed service repository.
# REPOGRAPH_DISPATCH_TOKEN must be able to send repository dispatches to the
# dedicated graph repository. GRAPH_REPOSITORY is owner/name.

name: notify RepoGraph

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the cross-repo graph
        env:
          GH_TOKEN: ${{ secrets.REPOGRAPH_DISPATCH_TOKEN }}
          GRAPH_REPOSITORY: your-org/code-graph
        run: |
          gh api --method POST \
            "repos/${GRAPH_REPOSITORY}/dispatches" \
            -f event_type=repograph-update \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
