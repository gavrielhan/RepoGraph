# Example: index other GitHub repos into a network-reachable Neo4j
# (Aura or self-hosted) and comment blast radius on pull requests.
#
# Copy into .github/workflows/ in a consuming repo. This file is not
# registered as a workflow here so placeholder org names cannot fail CI.
#
# Required secrets: NEO4J_URI, NEO4J_PASSWORD
# Optional: REPOGRAPH_CLONE_TOKEN (PAT with contents:read on each indexed repo)
#
# Minimum token permissions: contents:read to clone; pull-requests:write
# only for the PR comment step.

name: repograph

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build graph
        uses: gavrielhan/RepoGraph/action@main
        with:
          repos: |
            your-org/service-a
            your-org/service-b
          neo4j-uri: ${{ secrets.NEO4J_URI }}
          neo4j-password: ${{ secrets.NEO4J_PASSWORD }}
          github-token: ${{ secrets.REPOGRAPH_CLONE_TOKEN || github.token }}

  blast-radius-comment:
    if: github.event_name == 'pull_request'
    needs: build-graph
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install repograph
        run: pip install --quiet "git+https://github.com/gavrielhan/RepoGraph.git"

      - name: Blast radius for PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOGRAPH_NEO4J_URI: ${{ secrets.NEO4J_URI }}
          REPOGRAPH_NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          repograph query --pr "${{ github.repository }}#${{ github.event.pull_request.number }}" \
            > blast_radius.txt || true
          cat blast_radius.txt

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s blast_radius.txt ]; then
            {
              echo '### repograph blast radius'
              echo '```'
              cat blast_radius.txt
              echo '```'
            } > comment.md
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          fi
