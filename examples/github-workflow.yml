# Copy into .github/workflows/ of each repo you want indexed.
#
# On every push to main this:
#   1. Rebuilds the graph IR (nodes, edges, index-run history)
#   2. Commits it to the `graph` branch (the graph sitting in GitHub)
#   3. Loads Neo4j if NEO4J_URI / NEO4J_PASSWORD secrets are set
#
# GitHub cannot host Neo4j. The JSONL files on the `graph` branch *are*
# the portable graph: clone that branch and `repograph query --offline`.
#
# Cross-repo: put this workflow in a dedicated data repo and list every
# service under `repos:`, with a PAT that can clone them (contents:read).
# Each service can also `repository_dispatch` that data repo on push.

name: repograph

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-graph:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore previous graph
        run: |
          git fetch origin graph:refs/remotes/origin/graph || true
          if git rev-parse --verify --quiet origin/graph; then
            git restore --source origin/graph -- graph
          fi

      - name: Build graph
        uses: gavrielhan/RepoGraph/action@main
        with:
          repos: |
            ${{ github.repository }}
          use-existing-checkout: "true"
          # The action expects clone-dir/<repo-name>; the checkout is ../<repo-name>.
          clone-dir: ..
          ir-dir: graph
          neo4j-uri: ${{ secrets.NEO4J_URI }}
          neo4j-password: ${{ secrets.NEO4J_PASSWORD }}
          github-token: ${{ secrets.REPOGRAPH_CLONE_TOKEN || github.token }}

      - name: Publish graph branch
        run: |
          cp -R graph "${RUNNER_TEMP}/repograph-graph"
          rm -rf graph
          if git rev-parse --verify --quiet origin/graph; then
            git switch -C graph origin/graph
          else
            git switch --orphan graph
            git rm -rf . || true
          fi
          rm -rf graph
          cp -R "${RUNNER_TEMP}/repograph-graph" graph
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graph
          if git diff --cached --quiet; then
            echo "No graph changes."
            exit 0
          fi
          git commit -m "index ${GITHUB_SHA}"
          git push origin graph

  blast-radius-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore graph
        run: |
          git fetch origin graph:refs/remotes/origin/graph
          git restore --source origin/graph -- graph

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install repograph
        run: pip install --quiet "git+https://github.com/gavrielhan/RepoGraph.git"

      - name: Blast radius for PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOGRAPH_NEO4J_URI: ${{ secrets.NEO4J_URI }}
          REPOGRAPH_NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          REPOGRAPH_IR_DIR: graph
        run: |
          repograph query --pr "${{ github.repository }}#${{ github.event.pull_request.number }}" \
            > blast_radius.txt || true
          cat blast_radius.txt

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s blast_radius.txt ]; then
            {
              echo '### repograph blast radius'
              echo '```'
              cat blast_radius.txt
              echo '```'
            } > comment.md
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          fi
