name: repograph
description: >
  Build a cross-repository code knowledge graph in Neo4j from CI.
  Headless: no browser, no OAuth; uses GITHUB_TOKEN (contents: read) and a
  repo list from inputs or repograph.yaml.

inputs:
  repos:
    description: Newline-separated owner/name list. Omit if repograph.yaml has a repos list.
    required: false
    default: ""
  neo4j-uri:
    description: Neo4j URI reachable from the runner (e.g. neo4j+s://xxxx.databases.neo4j.io).
    required: true
  neo4j-user:
    description: Neo4j user.
    required: false
    default: neo4j
  neo4j-password:
    description: Neo4j password. Pass a repository secret.
    required: true
  github-token:
    description: Token used to clone the target repos. Needs contents:read on each of them.
    required: false
    default: ${{ github.token }}
  use-existing-checkout:
    description: Set "true" when the workflow already checked the repos out into clone-dir.
    required: false
    default: "false"
  clone-dir:
    description: Directory the repos are cloned into (or already checked out in).
    required: false
    default: repos
  full:
    description: Set "true" to force a full (non-incremental) reload.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install repograph
      shell: bash
      run: pip install --quiet "${{ github.action_path }}/.."

    - name: Build graph
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPOGRAPH_NEO4J_URI: ${{ inputs.neo4j-uri }}
        REPOGRAPH_NEO4J_USER: ${{ inputs.neo4j-user }}
        REPOGRAPH_NEO4J_PASSWORD: ${{ inputs.neo4j-password }}
        REPOGRAPH_CLONE_DIR: ${{ inputs.clone-dir }}
      run: |
        ARGS=""
        while IFS= read -r repo; do
          [ -n "$repo" ] && ARGS="$ARGS --repos $repo"
        done <<< "${{ inputs.repos }}"
        [ "${{ inputs.use-existing-checkout }}" = "true" ] && ARGS="$ARGS --use-existing-checkout"
        repograph run --headless $ARGS
