<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repograph — select repos</title>
<style>
  :root {
    --bg: #0f1012;
    --panel: #16181b;
    --line: #26292e;
    --text: #e8e6e1;
    --muted: #8b9096;
    --accent: #c7f24c;
    --accent-ink: #101400;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 96px;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 20px; }

  /* signature element: wordmark + node glyph */
  header { padding: 40px 0 8px; display: flex; align-items: center; gap: 14px; }
  header svg { flex: none; }
  header .word { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
  header .word em { font-style: normal; color: var(--accent); }

  h1 { font-size: 16px; font-weight: 500; color: var(--muted); margin: 4px 0 24px; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  input[type="search"] {
    flex: 1 1 240px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
  }
  input[type="search"]::placeholder { color: var(--muted); }
  .toolbar button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  .toolbar button:hover { color: var(--text); border-color: var(--muted); }

  ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  li + li { border-top: 1px solid var(--line); }
  li label {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 4px 14px;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
  }
  li label:hover { background: var(--panel); }
  input[type="checkbox"] {
    width: 17px; height: 17px; accent-color: var(--accent);
    grid-row: span 2; margin: 0;
  }
  .name { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; }
  .name .owner { color: var(--muted); }
  .meta { grid-column: 2; color: var(--muted); font-size: 12.5px; display: flex; gap: 12px; flex-wrap: wrap; }
  .badge {
    grid-row: span 2; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
    border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 2px 9px;
  }
  .badge.private { border-color: #5a4d1f; color: #d3b44a; }

  .empty { padding: 48px 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
  .empty code { color: var(--text); font-size: 13px; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(15,16,18,0.92); backdrop-filter: blur(6px);
    border-top: 1px solid var(--line);
  }
  footer .wrap { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; padding-bottom: 14px; }
  #count { color: var(--muted); font-size: 14px; }
  #count strong { color: var(--accent); font-weight: 600; }
  #confirm {
    background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 650;
    padding: 10px 22px; cursor: pointer;
    transition: transform 80ms ease;
  }
  #confirm:hover:not(:disabled) { transform: translateY(-1px); }
  #confirm:disabled { opacity: 0.35; cursor: not-allowed; }

  .done { text-align: center; padding: 96px 24px; }
  .done .mark { font-size: 40px; color: var(--accent); }
  .done h2 { font-weight: 600; margin: 16px 0 8px; }
  .done p { color: var(--muted); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  @media (max-width: 560px) {
    .badge { display: none; }
    header { padding-top: 24px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <path d="M8 26 L17 9 L26 22" stroke="#3a3f45" stroke-width="1.6"/>
      <path d="M17 9 L26 22 L8 26" stroke="#3a3f45" stroke-width="1.6"/>
      <circle cx="8" cy="26" r="4.2" fill="#c7f24c"/>
      <circle cx="17" cy="9" r="3.2" fill="#2c3036" stroke="#4a5058" stroke-width="1.2"/>
      <circle cx="26" cy="22" r="3.2" fill="#2c3036" stroke="#4a5058" stroke-width="1.2"/>
    </svg>
    <div class="word">repo<em>graph</em></div>
  </header>
  <h1>Select repos to include in the graph</h1>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Filter by name, owner, or language" aria-label="Filter repositories">
    <button id="selectVisible" type="button">Select shown</button>
    <button id="clearAll" type="button">Clear</button>
  </div>

  <ul id="list" aria-label="Your repositories"></ul>
  <div class="empty" id="empty" hidden>
    <p>No repositories loaded.</p>
    <p>Check that your token has the <code>repo</code> scope, then re-run <code>repograph activate</code>.</p>
  </div>
</div>

<footer id="footer">
  <div class="wrap">
    <span id="count"><strong>0</strong> selected</span>
    <button id="confirm" disabled>Build graph</button>
  </div>
</footer>

<script>
const repos = /*__REPOS__*/[];
const list = document.getElementById("list");
const empty = document.getElementById("empty");
const search = document.getElementById("search");
const count = document.getElementById("count");
const confirmBtn = document.getElementById("confirm");
const selected = new Set();

function relTime(iso) {
  if (!iso) return "";
  const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (days < 1) return "pushed today";
  if (days < 30) return `pushed ${days}d ago`;
  if (days < 365) return `pushed ${Math.floor(days / 30)}mo ago`;
  return `pushed ${Math.floor(days / 365)}y ago`;
}

function render() {
  const q = search.value.trim().toLowerCase();
  list.innerHTML = "";
  let shown = 0;
  for (const r of repos) {
    const hay = `${r.full_name} ${r.language}`.toLowerCase();
    if (q && !hay.includes(q)) continue;
    shown++;
    const li = document.createElement("li");
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.has(r.full_name);
    cb.addEventListener("change", () => {
      cb.checked ? selected.add(r.full_name) : selected.delete(r.full_name);
      updateCount();
    });
    const name = document.createElement("span");
    name.className = "name";
    name.innerHTML = `<span class="owner">${esc(r.owner)}/</span>${esc(r.name)}`;
    const badge = document.createElement("span");
    badge.className = "badge" + (r.private ? " private" : "");
    badge.textContent = r.private ? "private" : "public";
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = [r.language, relTime(r.pushed_at)].filter(Boolean).join("  ·  ");
    label.append(cb, name, badge, meta);
    li.append(label);
    list.append(li);
  }
  empty.hidden = !(repos.length === 0);
  list.hidden = repos.length === 0;
  return shown;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function updateCount() {
  count.innerHTML = `<strong>${selected.size}</strong> selected`;
  confirmBtn.disabled = selected.size === 0;
}

search.addEventListener("input", render);
document.getElementById("selectVisible").addEventListener("click", () => {
  const q = search.value.trim().toLowerCase();
  for (const r of repos) {
    if (!q || `${r.full_name} ${r.language}`.toLowerCase().includes(q)) selected.add(r.full_name);
  }
  render(); updateCount();
});
document.getElementById("clearAll").addEventListener("click", () => {
  selected.clear(); render(); updateCount();
});

confirmBtn.addEventListener("click", async () => {
  confirmBtn.disabled = true;
  confirmBtn.textContent = "Building…";
  const payload = repos
    .filter(r => selected.has(r.full_name))
    .map(r => ({ full_name: r.full_name, clone_url: r.clone_url }));
  try {
    const resp = await fetch("/selection", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) throw new Error(resp.statusText);
    document.getElementById("app").innerHTML = `
      <div class="done">
        <div class="mark">●</div>
        <h2>Building your graph</h2>
        <p>${payload.length} repo${payload.length === 1 ? "" : "s"} queued. You can close this tab and return to your CLI.</p>
      </div>`;
    document.getElementById("footer").remove();
  } catch (e) {
    confirmBtn.disabled = false;
    confirmBtn.textContent = "Build graph";
    alert("Could not reach the local repograph server. Return to your CLI and retry.");
  }
});

render();
updateCount();
</script>
</body>
</html>
